<!doctype html>
<html lang="ja" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- 数字(公開 API から生成)と、場面で共通の描き方 -->
    <script src="assets/data.js"></script>
    <!-- 発表者の名前(Git の対象外。無いときは名前を出さない。見本は presenter.example.js) -->
    <script src="assets/presenter.js"></script>
    <script src="assets/common.js"></script>
    <style>
      /* ダッシュボード(web/style.css)と同じ色 */
      :root {
        --ground: #f9f9f7;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --ink-3: #898781;
        --grid: #e1e0d9;
        --border: rgba(11, 11, 11, 0.1);
        --blue: #2a78d6;
        --blue-wash: rgba(42, 120, 214, 0.1);
        --orange: #eb6834;
        --event: #2e2d2a;
        --font-jp: "Noto Sans JP", sans-serif;
        --font-num: "Inter", "Noto Sans JP", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-jp);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* 場面で共通の部品 */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(11, 11, 11, 0.06);
      }
      .num {
        font-family: var(--font-num);
        font-variant-numeric: tabular-nums;
      }
      .source {
        font-size: 28px;
        color: var(--ink-2);
      }
      .mi-grid line {
        stroke: var(--grid);
        stroke-width: 1.5;
      }
      .mi-axis {
        font-family: var(--font-num);
        font-size: 28px;
        fill: var(--ink-2);
      }
      .mi-bar {
        fill: var(--blue);
      }
      .mi-event-major {
        stroke: var(--event);
        stroke-width: 4;
      }
      .mi-event-patch {
        stroke: var(--event);
        stroke-width: 3;
        stroke-dasharray: 10 8;
      }
    </style>
  </head>
  <body>
    <!-- 場面の頭と長さは、編集した録音(assets/voice/、Git の対象外)の声に合わせてある。各場面は話し始めの 0.5 秒前に切り替わる -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="228.75"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="19.1"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="title"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="19.1"
        data-duration="5.86"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="purpose"
        data-composition-id="purpose"
        data-composition-src="compositions/purpose.html"
        data-start="24.96"
        data-duration="29.58"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="audience"
        data-composition-id="audience"
        data-composition-src="compositions/audience.html"
        data-start="54.54"
        data-duration="19.78"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="architecture"
        data-composition-id="architecture"
        data-composition-src="compositions/architecture.html"
        data-start="74.32"
        data-duration="46.47"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="case"
        data-composition-id="case"
        data-composition-src="compositions/case.html"
        data-start="120.79"
        data-duration="53.39"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="operations"
        data-composition-id="operations"
        data-composition-src="compositions/operations.html"
        data-start="174.18"
        data-duration="24.36"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="next"
        data-composition-id="next"
        data-composition-src="compositions/next.html"
        data-start="198.54"
        data-duration="17.98"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="216.52"
        data-duration="12.23"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- ナレーション(本人の録音を編集したもの。Git の対象外) -->
      <audio
        id="narration"
        class="clip"
        src="assets/voice/narration-v2.wav"
        data-start="0"
        data-track-index="2"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
