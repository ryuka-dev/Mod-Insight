  </style>
  <div id="root" data-composition-id="audience" data-width="1920" data-height="1080">
    <div id="aud-clip" class="clip" data-start="0" data-duration="22" data-hold data-layout-allow-overflow>
      <div id="aud-head">
        <div id="aud-head-small">見ていただきたいのは</div>
        <div id="aud-head-big"><em>IT 企業</em>の方</div>

      <div id="aud-chain">
        <div class="aud-step">
          <div class="aud-step-title">データの取得</div>
          <div class="aud-step-sub">配布サイト 2 つ<br />Steam のお知らせ</div>

  <script>
    (function () {
      const CUES = { head: 0.2, chain: 3.6, since: 9.6, reuse: 14.2, roll1: 16.4, roll2: 18.0 };
      const MI = window.MI;
      const tl = gsap.timeline({ paused: true });

      MI.blurIn(tl, "#aud-head-small", CUES.head);
      MI.blurIn(tl, "#aud-head-big", CUES.head + 0.5);

      // 流れの順に 1 つずつ(矢印は手前の段と一緒に出る)
      const parts = [...document.querySelectorAll("#aud-chain > *")];
      parts.forEach((p, i) => {
        tl.fromTo(p, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, CUES.chain + i * 0.5);
      });
      MI.blurIn(tl, "#aud-since", CUES.since);
      MI.blurIn(tl, "#aud-reuse", CUES.reuse);

      // 対象の語が入れ替わる(下から上へ 0.3 秒)
      gsap.set(["#aud-w2", "#aud-w3"], { yPercent: 110 });
      [
        ["#aud-w1", "#aud-w2", CUES.roll1],
        ["#aud-w2", "#aud-w3", CUES.roll2],
      ].forEach(([out, inn, at]) => {
        tl.to(out, { yPercent: -110, duration: 0.3, ease: "power3.in" }, at);
        tl.fromTo(inn, { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: "expo.out" }, at + 0.15);
      });

      window.__timelines["audience"] = tl;
    })();
  </script>
