<!doctype html>
<html lang="ja" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- 数字(公開 API から生成)と、場面で共通の描き方 -->
    <script src="assets/data.js"></script>
    <script src="assets/common.js"></script>
    <style>
      /* ダッシュボード(web/style.css)と同じ色 */
      :root {
        --ground: #f9f9f7;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --ink-3: #898781;
        --grid: #e1e0d9;
        --border: rgba(11, 11, 11, 0.1);
        --blue: #2a78d6;
        --blue-wash: rgba(42, 120, 214, 0.1);
        --orange: #eb6834;
        --event: #2e2d2a;
        --font-jp: "Noto Sans JP", sans-serif;
        --font-num: "Inter", "Noto Sans JP", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-jp);
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* 場面で共通の部品 */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(11, 11, 11, 0.06);
      }
      .num {
        font-family: var(--font-num);
        font-variant-numeric: tabular-nums;
      }
      .source {
        font-size: 28px;
        color: var(--ink-2);
      }
      .mi-grid line {
        stroke: var(--grid);
        stroke-width: 1.5;
      }
      .mi-axis {
        font-family: var(--font-num);
        font-size: 28px;
        fill: var(--ink-2);
      }
      .mi-bar {
        fill: var(--blue);
      }
      .mi-event-major {
        stroke: var(--event);
        stroke-width: 4;
      }
      .mi-event-patch {
        stroke: var(--event);
        stroke-width: 3;
        stroke-dasharray: 10 8;
      }
    </style>
  </head>
  <body>
    <!-- 場面の長さは録音前の仮の値(原稿の文字数から見積もり)。録音を編集したあと、音声に合わせて直す -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="276"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="hook"

        data-composition-src="compositions/hook.html"
        data-start="0"

        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="title"

        data-height="1080"

      <div
        id="case"

      <div

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
