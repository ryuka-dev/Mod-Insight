  <div id="root" data-composition-id="operations" data-width="1920" data-height="1080">

            </g>

      <div id="ops-right" class="card">

      <div id="ops-log" class="card">
        <h3>本番で起きた問題の記録(docs/ops-log.md)</h3>
        <div class="ops-log-item">その日はじめてのアクセスに約 50 秒かかる<span>2026-09-16</span></div>
        <div class="ops-log-item">費用のほとんどが監視(ログ検索アラート)だった<span>2026-09-24</span></div>
        <div class="ops-log-item">1 件の保存失敗と、取得が動いているのに届いた通知<span>2026-10-20</span></div>
      </div>

  </div>
  <script>
    (function () {
      const CUES = { notify: 0.4, merge: 7.44, joined: 15.8, cost: 16.98, month: 17.78, log: 19.98 };
      const MI = window.MI;
      const D = MI.data;
      const tl = gsap.timeline({ paused: true });

      MI.blurIn(tl, "#ops-title", 0.1);
      MI.blurIn(tl, "#ops-notify h3", CUES.notify);
      tl.fromTo(".ops-cond", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.8 }, CUES.notify + 0.6);

      gsap.set(["#ops-merge", "#ops-one"], { opacity: 0 });
      tl.to("#ops-merge", { opacity: 1, duration: 0.2 }, CUES.merge);
      tl.fromTo("#ops-rules", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUES.merge);
      document.querySelectorAll("#ops-lines path").forEach((p) => {
        const len = p.getTotalLength();
        tl.fromTo(p, { attr: { "stroke-dasharray": `${len} ${len}`, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, CUES.joined);
      });
      tl.to("#ops-one", { opacity: 1, duration: 0.2 }, CUES.joined + 0.6);
      tl.to("#ops-rules .ops-price", { opacity: 0.35, duration: 0.3 }, CUES.joined + 0.6);

      // 日別の費用。9/24 にアラートを 1 本にまとめた
      const days = D.costs.days;
      const svg = document.getElementById("ops-cost-svg");
      const W = 780, H = 440, pad = { l: 70, r: 10, t: 70, b: 50 };
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const maxV = 10;
      const band = (W - pad.l - pad.r) / days.length;
      const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / maxV);
      const grid = MI.el("g", { class: "mi-grid" }, svg);
      for (let v = 0; v <= maxV; v += 5) {
        MI.el("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v) }, grid);
        MI.el("text", { x: pad.l - 12, y: y(v) + 9, "text-anchor": "end", class: "mi-axis" }, grid).textContent = `${v}`;
      }
      MI.el("text", { x: pad.l - 12, y: pad.t - 30, "text-anchor": "end", class: "mi-axis" }, grid).textContent = "円/日";
      const bars = days.map((d, i) => {
        const h = y(0) - y(Math.min(d.total, maxV));
        const r = MI.el("rect", { x: pad.l + band * i + band * 0.15, y: y(0) - h, width: band * 0.7, height: h, class: "ops-cost-bar" }, svg);
        r.style.transformBox = "fill-box";
        r.style.transformOrigin = "center bottom";
        return r;
      });
      [0, days.findIndex((d) => d.date === "2026-10-01"), days.length - 1].forEach((i) => {
        if (i < 0) return;
        MI.el("text", { x: pad.l + band * i + band / 2, y: H - 12, "text-anchor": "middle", class: "mi-axis" }, svg).textContent = MI.md(days[i].date);
      });
      const mi = days.findIndex((d) => d.date === "2026-09-24");
      const mx = pad.l + band * mi + band / 2;
      const mark = MI.el("g", {}, svg);
      MI.el("line", { x1: mx, x2: mx, y1: pad.t - 20, y2: y(0), class: "mi-event-patch" }, mark);
      MI.el("text", { x: mx + 12, y: pad.t - 24, class: "ops-note" }, mark).textContent = "9/24 アラートを 1 本に";

      gsap.set(["#ops-right", "#ops-month"], { opacity: 0 });
      tl.to("#ops-right", { opacity: 1, duration: 0.3 }, CUES.cost);
      tl.fromTo(bars, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "expo.out", stagger: 0.015 }, CUES.cost + 0.2);
      tl.fromTo(mark, { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUES.cost + 1.4);
      tl.to("#ops-month", { opacity: 1, duration: 0.2 }, CUES.month);
      MI.countUp(tl, document.getElementById("ops-month-value"), D.costs.byMonth["2026-10"], CUES.month);

      // 左側が運用記録に入れ替わる
      gsap.set("#ops-log", { opacity: 0 });
      MI.blurOut(tl, "#ops-left", CUES.log - 0.2);
      MI.blurIn(tl, "#ops-log", CUES.log);
      tl.fromTo(".ops-log-item", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.5 }, CUES.log + 0.3);

      window.__timelines["operations"] = tl;
    })();
  </script>
