      MI.blurIn(tl, "#arch-title", CUES.title);
      tl.fromTo("#arch-func", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, CUES.func);
      gsap.set(["#arch-ad1", "#arch-ad2", "#arch-ad3", "#arch-shape"], { opacity: 0 });
      tl.fromTo("#arch-timer", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUES.func + 0.6);

      tl.fromTo(["#arch-ts", "#arch-nx", "#arch-steam"], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out", stagger: 0.5 }, CUES.sources);

      tl.fromTo(["#arch-ad1", "#arch-ad2"], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.3 }, CUES.adapters);
      MI.blurIn(tl, "#arch-shape", CUES.adapters + 1.4);

      tl.fromTo("#arch-sql", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, CUES.sql);
      gsap.set("#arch-paused", { opacity: 0 });
      draw("#arch-p-sql", CUES.sql + 0.3);

      tl.fromTo("#arch-ad3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, CUES.extra);

      // 対策前: 画面が DB に問い合わせ、DB の起動を待つ

      draw("#arch-p-dashsql", CUES.wait + 1.0);
      tl.fromTo("#arch-paused", { opacity: 0 }, { opacity: 1, duration: 0.2 }, CUES.wait + 1.6);
      gsap.set("#arch-wait", { opacity: 0 });
      tl.to("#arch-wait", { opacity: 1, duration: 0.2 }, CUES.wait + 2.4);
      MI.countUp(tl, document.getElementById("arch-wait-value"), 50, CUES.wait + 2.4, { duration: 2.5 });

      gsap.set("#arch-fast", { opacity: 0 });
      MI.blurIn(tl, "#arch-fast", CUES.blob + 4.8);

      tl.fromTo("#arch-deploy > *", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.6 }, CUES.deploy);

      window.__timelines["architecture"] = tl;
